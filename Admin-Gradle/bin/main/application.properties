spring.application.name=admin-gradle
spring.security.user.name=admin
spring.security.user.password=admin123


management.endpoint.shutdown.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

spring.boot.admin.client.instance.metadata.user.name=${spring.security.user.name}
spring.boot.admin.client.instance.metadata.user.password=${spring.security.user.password}
spring.boot.admin.routes.endpoints=env, metrics, trace, jolokia, info, configprops, shutdown
server.port=9090

# Enable event publishing
spring.boot.admin.event.logging.enabled=true


# Detailed logging for Spring Boot Admin
logging.level.de.codecentric.boot.admin=DEBUG
logging.level.org.springframework.context.event=DEBUG


# Set log levels to suppress unnecessary logs
logging.level.root=ERROR
logging.level.org.springframework=ERROR
logging.level.org.springframework.web.reactive.function.client=ERROR
logging.level.reactor.netty.http.client=ERROR
logging.level.org.apache.catalina=ERROR
logging.level.org.apache.tomcat=ERROR
logging.level.org.springframework.boot.logging=DEBUG

# Enable logging for instance events
logging.level.de.codecentric.boot.admin.server.events=INFO
logging.level.com.example.admin_gradle.InstanceEventLogger=INFO

# Suppress other logs in Spring Boot Admin
logging.level.de.codecentric.boot.admin.server.services=ERROR

# Log file configuration
logging.file.name=/admin-gradle/logs/instance-events.log

logging.config=classpath:logback-spring.xml
